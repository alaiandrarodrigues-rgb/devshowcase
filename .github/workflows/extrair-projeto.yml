name: Extrair projeto

on:
  push:
    branches:
      - principal
permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          if [ -f DevShowcase-completo.zip ]; then
            unzip -o DevShowcase-completo.zip
            rm DevShowcase-completo.zip
          fi

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Adicionar projeto DevShowcase"
          git push
